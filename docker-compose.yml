services:
  postgres:
    container_name: postgres

    image: postgres:15.15

    ports:
      - 5432:5432

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}

    volumes:
      - postgres-data:/var/lib/postgresql/data

  # redis:
  #   container_name: redis

  #   image: redis:8.4

  #   ports:
  #     - 6379:6379

  #   volumes:
  #     - redis-data:/data

volumes:
  postgres-data:
