services:
  app:
    container_name: zerostream-server

    build:
      context: ..
      dockerfile: Dockerfile.prod

    ports:
      - 4000:4000

    depends_on:
      - postgres
      - redis

    env_file:
      - ../.env.prod

    restart: unless-stopped

  postgres:
    container_name: postgres

    image: postgres:15.15

    ports:
      - 5432:5432

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}

    restart: always

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    container_name: redis

    image: redis:8.4

    ports:
      - 6379:6379

    restart: always

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
